name: Validar contribuicao

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validar:
    name: validar-estrutura
    runs-on: ubuntu-latest

    steps:
      - name: Baixar versao confiavel da configuracao
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Validar autor e arquivos alterados
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          with open("contributors.json", encoding="utf-8") as f:
              contributors = json.load(f)

          author = os.environ["PR_AUTHOR"]
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          head_ref = os.environ["PR_HEAD_REF"]

          folders = {
              login.casefold(): folder
              for login, folder in contributors.items()
          }
          folder = folders.get(author.casefold())

          if not folder:
              sys.exit(
                  f"Integrante nao cadastrado: {author}. "
                  "Adicione o login correto em contributors.json."
              )

          if (
              not isinstance(folder, str)
              or not folder
              or folder in {".", ".."}
              or "/" in folder
              or "\\" in folder
          ):
              sys.exit("Nome de pasta invalido em contributors.json.")

          result = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              capture_output=True,
              text=True,
              check=True,
          )
          files = [p for p in result.stdout.splitlines() if p.strip()]

          if not files:
              sys.exit("Nenhum arquivo alterado foi encontrado.")

          prefix = f"solutions/{folder}/"
          trusted_migration = (
              author.casefold() == "icaroplira"
              and head_ref == "migration/initial-solutions"
              and all(p.startswith("solutions/") for p in files)
          )
          trusted_automation_config = (
              author.casefold() == "icaroplira"
              and head_ref == "automation/personal-branch-sync"
              and files == [".github/workflows/sincronizar-branch-pessoal.yml"]
          )
          invalid = [] if (trusted_migration or trusted_automation_config) else [
              p for p in files if not p.startswith(prefix)
          ]

          if invalid:
              print(f"Autor do PR: {author}")
              print(f"Pasta permitida: {prefix}")
              print("Arquivos fora da pasta permitida:")
              for path in invalid:
                  print(f" - {path}")
              sys.exit(1)

          if trusted_migration:
              print(f"Migracao inicial validada: {len(files)} arquivo(s) em solutions/.")
          elif trusted_automation_config:
              print("Configuracao controlada do workflow de sincronizacao validada.")
          else:
              print(f"Validado: {author}; {len(files)} arquivo(s) em {prefix}")
          PY
